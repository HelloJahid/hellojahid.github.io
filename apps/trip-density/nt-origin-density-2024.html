<style>
:root{
  --plane:#eef1f5; --water:#dde6ee; --land:#f7f6f2; --surface:#ffffff;
  --ink:#0f1720; --ink2:#4a5563; --muted:#8a94a3; --hair:#e2e7ee; --accent:#2a78d6; --bnd:#5b6675;
  --shadow:0 1px 2px rgba(15,23,32,.05),0 10px 30px rgba(15,23,32,.07);
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --plane:#0c0f13; --water:#121a24; --land:#1b212b; --surface:#161b22;
  --ink:#f3f6fa; --ink2:#aeb8c6; --muted:#7b8494; --hair:#252c36; --accent:#3987e5; --bnd:#8794a6;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  --plane:#0c0f13; --water:#121a24; --land:#1b212b; --surface:#161b22;
  --ink:#f3f6fa; --ink2:#aeb8c6; --muted:#7b8494; --hair:#252c36; --accent:#3987e5; --bnd:#8794a6;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px rgba(0,0,0,.5);
}
:root[data-theme="light"]{
  --plane:#eef1f5; --water:#dde6ee; --land:#f7f6f2; --surface:#ffffff;
  --ink:#0f1720; --ink2:#4a5563; --muted:#8a94a3; --hair:#e2e7ee; --accent:#2a78d6; --bnd:#5b6675;
  --shadow:0 1px 2px rgba(15,23,32,.05),0 10px 30px rgba(15,23,32,.07);
}
*{box-sizing:border-box}
body{margin:0;background:var(--plane);color:var(--ink);font-family:var(--sans);
  line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding:clamp(20px,4vw,52px) clamp(16px,4vw,32px)}
.eyebrow{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  font-family:var(--mono);margin-bottom:14px}
h1{font-size:clamp(1.9rem,4.4vw,3rem);line-height:1.05;letter-spacing:-.02em;margin:0 0 .5em;
  text-wrap:balance;font-weight:680;max-width:22ch}
h1 em{font-style:italic;color:var(--accent)}
.dek{font-size:1.04rem;color:var(--ink2);max-width:72ch}
.dek strong{color:var(--ink);font-weight:620}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:28px 0 12px}
@media(max-width:680px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--surface);border:1px solid var(--hair);border-radius:12px;
  padding:15px 16px;box-shadow:var(--shadow)}
.t-k{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-family:var(--mono)}
.t-v{font-size:1.7rem;font-weight:660;letter-spacing:-.02em;margin:5px 0 2px;font-variant-numeric:tabular-nums}
.t-s{font-size:.8rem;color:var(--ink2)}
.controls{display:flex;align-items:center;gap:18px;margin:20px 0 10px;flex-wrap:wrap;font-size:.82rem;color:var(--ink2)}
.ctl-k{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-family:var(--mono);margin-right:6px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--hair);border-radius:999px;padding:3px;box-shadow:var(--shadow)}
.seg button{border:0;background:transparent;color:var(--ink2);font:inherit;font-size:.8rem;padding:5px 13px;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
.legend{display:flex;align-items:center;gap:12px;margin:10px 0 8px;font-size:.82rem;color:var(--ink2);flex-wrap:wrap}
.ramp{height:10px;width:180px;border-radius:999px;background:linear-gradient(90deg,#cde2fb,#86b6ef,#3987e5,#256abf,#104281,#0d366b)}
.legend .cap{font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.mapcard{position:relative;background:var(--surface);border:1px solid var(--hair);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.mapcard svg{display:block;width:100%;height:auto;background:var(--water);cursor:grab}
.mapcard svg:active{cursor:grabbing}
.hex{stroke:none}
.bnd{fill:none;stroke:var(--bnd);stroke-width:.6;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none;opacity:.55}
.bnd.empty{stroke-dasharray:3 2;opacity:.9}
/* paint-order lets the halo sit UNDER the glyph, so a name stays readable
   over dark hexes without the stroke eating the letterforms */
.lbl{font-family:var(--sans);font-size:12px;font-weight:640;fill:var(--ink);
  stroke:var(--surface);stroke-width:3px;paint-order:stroke fill;
  text-anchor:middle;dominant-baseline:middle;pointer-events:none;
  letter-spacing:-.01em}
.zoom{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:32px;height:32px;border-radius:9px;border:1px solid var(--hair);background:var(--surface);color:var(--ink);font-size:1rem;cursor:pointer;box-shadow:var(--shadow)}
.hint{font-family:var(--mono);font-size:.72rem;color:var(--muted);margin:10px 2px 0}
#tip{position:fixed;pointer-events:none;z-index:10;background:var(--surface);color:var(--ink);border:1px solid var(--hair);border-radius:10px;box-shadow:var(--shadow);padding:9px 12px;font-size:.8rem;display:none;max-width:260px;line-height:1.45}
#tip b{display:block;font-size:.84rem;margin-bottom:2px}
#tip span{display:block;color:var(--ink2)}
#tip .tc{color:var(--muted);font-size:.72rem}
.foot{margin:28px 0 8px;font-size:.78rem;color:var(--muted);font-family:var(--mono)}

  /* ---- presentation: full-viewport map, floating chrome ----
     The map is the page. Everything else floats over it. */
  html, body { height: 100%; overflow: hidden; }
  .wrap { max-width: none; margin: 0; padding: 0; height: 100%; }
  .mapcard { border: 0; border-radius: 0; box-shadow: none; height: 100%; }
  .mapcard svg, .mapcard canvas { height: 100%; }

  /* Kept in the DOM, not deleted: the JS reads #tiles (and #segLbl on the six)
     without a null check, so removing the markup throws and takes the map with
     it. Hidden instead. Never "tidy up" by deleting these. */
  .tiles, #lblCtl { display: none !important; }

  .chrome {
    position: absolute; z-index: 9; background: var(--surface);
    border: 1px solid var(--hair); border-radius: 11px; padding: 11px 13px;
    box-shadow: var(--shadow);
    font: 400 .82rem/1.45 var(--sans); color: var(--ink2);
  }
  .chrome-id { top: 14px; left: 14px; max-width: min(20rem, calc(100vw - 7rem)); }
  .chrome-id .back {
    display: block; font-family: var(--mono); font-size: .68rem; letter-spacing: .09em;
    text-transform: uppercase; color: var(--accent); text-decoration: none; margin-bottom: 6px;
  }
  .chrome-id .back:hover { text-decoration: underline; }
  .chrome-id b { display: block; font-size: 1.02rem; color: var(--ink); letter-spacing: -.01em; }
  .chrome-id em {
    display: block; font-style: normal; font-family: var(--mono); font-size: .68rem;
    letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-top: 3px;
  }

  /* Holds the legend, the scale toggle, and -- on Victoria only -- the label
     modes and corridor chips. VIC has one control more than the others by
     design: the chrome is normalised, the capability is not removed. */
  .chrome-key {
    bottom: 14px; left: 14px; display: grid; gap: 9px;
    max-width: min(30rem, calc(100vw - 2rem));
    max-height: min(46vh, 22rem); overflow-y: auto;
  }
  .chrome-key .legend,
  .chrome-key .controls,
  .chrome-key .arc-legend { margin: 0; }
  .chrome-key .legend { gap: 9px; font-size: .78rem; }
  .chrome-key .ramp { width: 132px; }
  .chrome-key .controls { gap: 10px; font-size: .78rem; }

  @media (max-width: 760px) {
    .chrome { padding: 9px 11px; }
    .chrome-key { max-height: 40vh; }
    .chrome-key .ramp { width: 92px; }
  }
</style>

          <span class="tc">${h.h3} &middot; res-8 hex</span>`;}
  if(html){tip.innerHTML=html;tip.style.display="block";
    const vw=innerWidth,tw=tip.offsetWidth;
    tip.style.left=Math.min(e.clientX+14,vw-tw-10)+"px";
    tip.style.top=(e.clientY+14)+"px";
  }else tip.style.display="none";});
svg.addEventListener("mouseleave",()=>tip.style.display="none");
const view=document.getElementById("view");
let k=1,tx=0,ty=0;
const ap=()=>view.setAttribute("transform",`translate(${tx},${ty}) scale(${k})`);

// ---------- LGA name labels ----------
// Screen space is finite, so at statewide zoom only a subset can be drawn.
// Three rules, applied in that order, decide which:
//   1. RANK    the biggest LGAs on screen are always worth naming
//   2. REVEAL  a small LGA earns its label once zoom makes it big enough
//   3. CLASH   whatever survives is dropped if it would overlap a name
//              already placed, so labels never pile up illegibly
// Font size is divided by k so text keeps a constant apparent size as the
// group scales underneath it.
const LBL_FS=12, REVEAL_PX=64, MAJOR_N=12;
const lblG=document.getElementById("lbls");
const tripsBy={};
DATA.lgas.forEach(l=>{tripsBy[l.name]=l.hexes.reduce((s,h)=>s+h.t,0);});
const lblInfo=(DATA.bnds||[]).map((b,ix)=>{
  let mnx=1e9,mny=1e9,mxx=-1e9,mxy=-1e9;
  b.rings.forEach(r=>r.forEach(([lo,la])=>{
    const X=px(lo),Y=py(la);
    if(X<mnx)mnx=X;if(X>mxx)mxx=X;if(Y<mny)mny=Y;if(Y>mxy)mxy=Y;}));
  return {id:ix,name:b.name,x:px(b.ctr[0]),y:py(b.ctr[1]),
          trips:tripsBy[b.name]||0,diag:Math.hypot(mxx-mnx,mxy-mny)};});
// TWO independent rankings, and priority is the better of the two. Ranking by
// on-screen size alone names only the vast empty outback shires and leaves the
// metro — where nearly all the data is — unlabelled until you zoom right in.
// Ranking by trips alone would never name the sparse regions whose coverage
// this preview exists to check. Taking the min honours both.
[...lblInfo].sort((a,b)=>b.diag-a.diag).forEach((i,r)=>i.rSize=r);
[...lblInfo].sort((a,b)=>b.trips-a.trips).forEach((i,r)=>i.rTrips=r);
lblInfo.forEach(i=>i.rank=Math.min(i.rSize,i.rTrips));
lblG.innerHTML=lblInfo.map(i=>
  `<text class="lbl" x="${i.x.toFixed(1)}" y="${i.y.toFixed(1)}">${i.name}</text>`).join("");
const lblEls=[...lblG.querySelectorAll("text")];
let lblMode="auto";
function updateLabels(){
  if(lblMode==="off"){lblEls.forEach(e=>e.style.display="none");return;}
  const placed=[],show={};
  // Highest priority first: when two names compete for the same space the more
  // important LGA wins, which keeps the map stable and predictable as you zoom.
  // Ties broken by id so the order is deterministic across redraws.
  const order=[...lblInfo].sort((a,b)=>(a.rank-b.rank)||(a.id-b.id));
  for(const i of order){
    if(lblMode!=="all" && !(i.rank<MAJOR_N || i.diag*k>REVEAL_PX))continue;
    const sx=i.x*k+tx, sy=i.y*k+ty, w=i.name.length*6.6+10;
    let clash=false;
    for(const p of placed)
      if(Math.abs(sx-p.sx)<(w+p.w)/2 && Math.abs(sy-p.sy)<15){clash=true;break;}
    if(clash)continue;
    placed.push({sx,sy,w});show[i.id]=true;}
  lblInfo.forEach((i,ix)=>{
    const e=lblEls[ix];
    e.style.display=show[i.id]?"":"none";
    e.style.fontSize=(LBL_FS/k).toFixed(2)+"px";
    e.style.strokeWidth=(3/k).toFixed(2)+"px";});
}
const segL=document.getElementById("segLbl");
if(segL)segL.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{
  segL.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));
  lblMode=b.dataset.v;updateLabels();}));
if(!(DATA.bnds||[]).length){const c=document.getElementById("lblCtl");if(c)c.style.display="none";}

function zoom(f,cx,cy){const nk=Math.max(1,Math.min(60,k*f));
  tx=cx-(cx-tx)*(nk/k);ty=cy-(cy-ty)*(nk/k);k=nk;ap();updateLabels();}
svg.addEventListener("wheel",e=>{e.preventDefault();
  const r=svg.getBoundingClientRect(),sx=W/r.width;
  zoom(e.deltaY<0?1.25:0.8,(e.clientX-r.left)*sx,(e.clientY-r.top)*sx);},{passive:false});
let drag=null;
svg.addEventListener("pointerdown",e=>{drag={x:e.clientX,y:e.clientY,tx,ty};svg.setPointerCapture(e.pointerId);});
svg.addEventListener("pointermove",e=>{if(!drag)return;
  const r=svg.getBoundingClientRect(),sx=W/r.width;
  tx=drag.tx+(e.clientX-drag.x)*sx;ty=drag.ty+(e.clientY-drag.y)*sx;ap();updateLabels();});
svg.addEventListener("pointerup",()=>drag=null);
document.querySelectorAll(".zoom button").forEach(b=>b.addEventListener("click",()=>{
  const z=b.dataset.z;
  if(z==="reset"){k=1;tx=0;ty=0;ap();updateLabels();}else zoom(z==="in"?1.4:1/1.4,W/2,H/2);}));
updateLabels();
</script>
</body>
</html>
